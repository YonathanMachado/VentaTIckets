global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'artistas-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8086']

  - job_name: 'artistas-cloud'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['<EC2_PUBLIC_IP>:8086']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
