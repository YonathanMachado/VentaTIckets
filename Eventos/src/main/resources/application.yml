spring:
  application:
    name: Eventos
  datasource:
    url: jdbc:mysql://localhost:3306/db_eventos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
